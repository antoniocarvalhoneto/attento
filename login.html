<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Attento</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============ LOGIN VIEW ============ -->
  <div id="login-screen" class="login-screen">
    <div class="login-panel">
      <div class="login-brand">
        <div class="login-brand-mark"><img src="logo.png" alt="Attento" class="logo-mark"></div>
        <h1>Attento</h1>
      </div>
      <div class="login-card">
        <h2>Entrar</h2>
        <p class="login-card-sub">Use seu e-mail e senha para acessar sua unidade.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" name="email" autocomplete="username" placeholder="seu@email.com">
            <span class="field-error" id="login-email-error"></span>
          </div>
          <div class="field">
            <label for="login-password">Senha</label>
            <div class="password-wrap">
              <input type="password" id="login-password" name="password" autocomplete="current-password"
                placeholder="••••••">
              <button type="button" class="password-toggle" id="password-toggle" aria-label="Mostrar senha">
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="field-error" id="login-password-error"></span>
          </div>
          <span class="field-error" id="login-general-error"></span>
          <button type="submit" class="btn btn-primary btn-block" id="login-submit">
            <span class="btn-label">Entrar</span>
            <span class="btn-spinner" hidden><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i></span>
          </button>
        </form>
        <p class="login-help">Não consegue entrar? Peça ajuda ao responsável pela sua unidade.</p>
        <details class="login-demo">
          <summary>Experimentar com uma conta de demonstração</summary>
          <div class="login-demo-row">
            <button type="button" class="demo-chip" data-demo="admin">
              <strong>Administrador</strong><span>admin@demo.com · 123456</span>
            </button>
            <button type="button" class="demo-chip" data-demo="user">
              <strong>Usuário</strong><span>usuario@demo.com · 123456</span>
            </button>
          </div>
        </details>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>
  <script src="login-page.js"></script>
</body>

</html>
